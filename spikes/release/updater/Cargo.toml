[package]
name = "vessel-app-updater"
description = "How Vessel's native app updates itself: a signed feed, a check, a verified download, a swap and a restart"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license-file.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
minisign-verify.workspace = true
reqwest.workspace = true
rustls.workspace = true
rustls-native-certs.workspace = true
serde.workspace = true
serde_json.workspace = true
flate2.workspace = true
sha2.workspace = true
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true

# The "Installed apps" entry's version after a self-update (src/registry.rs).
# Already in the app's tree on Windows (GPUI's platform uses it); MIT or
# Apache-2.0; a safe API over the registry, so no `unsafe` here.
[target.'cfg(windows)'.dependencies]
windows-registry = "0.6"

[dev-dependencies]
minisign.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["io-util", "net", "rt-multi-thread"] }
# The log a test captures (tests/update.rs: the feed's path never in it).
tracing-subscriber = { workspace = true, features = ["fmt", "env-filter"] }
