<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vessel</title>
<style>
  /* The app's start page: shown while the app starts its connection to
     your machines (a moment), and if that fails. The app then opens the
     page Vessel serves. Nothing is loaded from anywhere: the system's
     sans font, no script but the one line below. */
  body { margin: 0; min-height: 100vh; display: grid; place-items: center;
         background: #FAFAFA; color: #121212;
         font: 16px/1.5 "Pretendard Variable", Pretendard, system-ui, sans-serif; }
  main { max-width: 22rem; padding: 2rem; text-align: center; }
  h1 { font-size: 1.125rem; font-weight: 600; margin: 0 0 0.5rem; }
  p { margin: 0; color: #5C5C5C; }
  .failed { display: none; }
  body.is-failed .starting { display: none; }
  body.is-failed .failed { display: block; }
  @media (prefers-color-scheme: dark) {
    body { background: #181818; color: #FAFAFA; }
    p { color: #A3A3A3; }
  }
</style>
</head>
<body>
<main>
  <div class="starting">
    <h1>Starting Vessel…</h1>
  </div>
  <div class="failed">
    <h1>Vessel could not start</h1>
    <p>The app's connection to your machines did not start on this
       phone. Close the app and open it again; if it keeps happening,
       send the app's log with your report.</p>
  </div>
</main>
<script>
  if (location.hash === "#failed") document.body.classList.add("is-failed");
</script>
</body>
</html>
