[package]
name = "vessel-app-view"
description = "What the app's screens mean (board, conversation), with no UI and no I/O"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license-file.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
chrono.workspace = true
jiff.workspace = true
serde.workspace = true
thiserror.workspace = true
vessel-proto.workspace = true
serde_json.workspace = true
similar.workspace = true
unicode-normalization.workspace = true
# The terminal's parser (ADR 0073); only this crate may use it.
vte.workspace = true
unicode-width.workspace = true
qrcode.workspace = true

fluent-bundle.workspace = true
fluent-syntax.workspace = true
fluent-pseudo.workspace = true
intl-memoizer.workspace = true
unic-langid.workspace = true

[build-dependencies]
fluent-syntax.workspace = true
unic-langid.workspace = true
thiserror.workspace = true

[dev-dependencies]
# Build tooling is included by the coverage example and gate tests.
fluent-syntax.workspace = true
unic-langid.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
allocation-counter.workspace = true

[target.'cfg(target_family = "wasm")'.dependencies]
# View does not call UUID: standalone browser builds need this feature for
# vessel-proto's ids. The app's GPUI dependency already selects the same
# feature; keep view independently buildable instead of relying on that edge.
uuid = { workspace = true, features = ["js"] }
