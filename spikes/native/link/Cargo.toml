[package]
name = "vessel-app-link"
description = "The app's link to its nodes through vessel-client: the book, routes, streams"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license-file.workspace = true
repository.workspace = true

[lints]
workspace = true

[features]
# `Link::detached`: a link with no task behind its queue, for the app's
# tests that fill the queue.
testing = []

[dependencies]
vessel-app-view.workspace = true
vessel-proto.workspace = true
bytes.workspace = true
chrono.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true

# The link to real nodes: `vessel-client` (tokio's network and runtime,
# rustls, files on disk), none of which a browser has.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
vessel-client.workspace = true
dirs.workspace = true
hostname.workspace = true
tokio.workspace = true

# In a browser (docs/plans/backend-m12-browser.md): the same channels, a
# demo fleet of wire records behind them until a websocket transport exists.
# tokio's `sync` is the only part of it that builds for wasm32.
[target.'cfg(target_arch = "wasm32")'.dependencies]
tokio = { version = "1", default-features = false, features = ["sync"] }

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
vessel-rpc.workspace = true
tokio = { workspace = true, features = ["io-util", "test-util"] }
