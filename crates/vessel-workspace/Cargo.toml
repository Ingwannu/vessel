[package]
name = "vessel-workspace"
description = "Projects, git worktrees, git and files for a Vessel node, kept inside their folders"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license-file.workspace = true
repository.workspace = true

[dependencies]
vessel-proc.workspace = true
vessel-proto.workspace = true
chrono.workspace = true
serde.workspace = true
sha2.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["fs"] }
tokio-util.workspace = true
toml_edit.workspace = true
tracing.workspace = true
# Parent directory file observation (ADR 0083), already used by vessel-lsp.
notify.workspace = true

[target.'cfg(unix)'.dependencies]
# `O_NONBLOCK | O_NOFOLLOW` for reads (`regular`); FIFOs in its tests.
nix = { workspace = true, features = ["fs"] }

[target.'cfg(target_os = "linux")'.dependencies]
# ADR 0077: safe FD-relative metadata/xattr/rename operations and effective UID;
# already resolved for store attachments. No new dependency version.
rustix = { workspace = true, features = ["fs", "process"] }

[dev-dependencies]
tempfile.workspace = true
# `write_executable`: scripts a test runs, written so running them never
# meets ETXTBSY.
vessel-testkit.workspace = true
# The tests find `git` on the test runner's `PATH`; the node finds it on its
# own and passes the path in.
which.workspace = true
tokio = { workspace = true, features = ["test-util"] }

[lints]
workspace = true
