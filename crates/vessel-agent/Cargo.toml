[package]
name = "vessel-agent"
description = "Vessel's ACP client: drives a harness or adapter over stdio and maps ACP to Vessel's agent timeline"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license-file.workspace = true
repository.workspace = true

[dependencies]
# A direct driver writes its agent's private launch file through the
# harness's own writer (`vessel_harness::claude_mcp_file`, `McpFile`), so
# the format and the file's checks have one owner (ADR 0057).
vessel-harness.workspace = true
vessel-proc.workspace = true
vessel-proto.workspace = true

agent-client-protocol.workspace = true
futures-util = { workspace = true, features = ["sink"] }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["io-util", "macros", "rt", "sync", "time"] }
tracing.workspace = true
# Claude Code's conversation ids: a new one minted for `--session-id`, a
# resumed one checked before it reaches `--resume` (ADR 0057).
uuid.workspace = true

[dev-dependencies]
# Temporary homes and owner-only directories (the Codex contract test, the
# Claude driver's MCP file tests).
tempfile.workspace = true
# `test-util`: a ranked listing's load budgets are checked on a paused clock.
tokio = { workspace = true, features = ["rt-multi-thread", "time", "test-util"] }
vessel-testkit.workspace = true

[lints]
workspace = true
