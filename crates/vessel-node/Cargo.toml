[package]
name = "vessel-node"
# Keep ordinary cargo run on the product, including feature-enabled builds.
default-run = "vesseld"
autobins = false
description = "Vessel node daemon (vesseld): runs agent harness sessions on one machine and serves them to clients over the Vessel protocol"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license-file.workspace = true
repository.workspace = true

[[bin]]
name = "vesseld"
path = "src/main.rs"

# Only the separate fixture executable can read a fake-forge seed. Even
# with this feature, vesseld's product arguments/environment stay real.
[features]
forge-fixture = ["vessel-forge/fake"]

[[bin]]
name = "vessel-forge-fixture"
path = "src/bin/forge_fixture.rs"
required-features = ["forge-fixture"]

[dependencies]
# A member's calls to its fleet's home (`fleet.*` over the secure channel,
# pairing with a `sync` invitation): the same client every device uses.
vessel-client.workspace = true
# What a probe's handshake said of an agent (`agent.status`, protocol 11,
# ADR 0032): its typed refusals; already below vessel-session.
vessel-agent.workspace = true
# Bundling on the home, materialising on members (ADR 0012).
vessel-fleet.workspace = true
vessel-forge.workspace = true
vessel-harness.workspace = true
# The model routing proxy's APIs and upstream client (ADR 0015).
vessel-llm.workspace = true
# Terminals' commands and the ports their trees listen on (ADR 0031), and
# an install's process group (`agent.install`, ADR 0032): started and
# stopped as the session runtime starts agents; already below it.
vessel-proc.workspace = true
vessel-proto.workspace = true
vessel-lsp.workspace = true
vessel-relay.workspace = true
vessel-rpc.workspace = true
vessel-secure.workspace = true
vessel-session.workspace = true
vessel-store.workspace = true
# Projects, worktrees, git and files (protocol 10, ADRs 0023 and 0027):
# the work; the node keeps who may call, the record and the sessions.
vessel-workspace.workspace = true

axum.workspace = true
# An image's or audio attachment's bytes for the agent's prompt (protocol
# 10, ADR 0025): base64, as ACP carries them; already in the workspace
# (vessel-proto's wire bytes).
base64.workspace = true
# The model proxy's own accept loop (`models::listen`): HTTP/1 with a
# header-read deadline and a bounded number of connections, which
# `axum::serve` cannot give (the M5 security review, finding 4). Already
# in the tree through axum and vessel-relay.
hyper.workspace = true
hyper-util.workspace = true
tower.workspace = true
bytes.workspace = true
chrono.workspace = true
clap.workspace = true
# The node user's home, for `~/` in profiles.toml (ADR 0011); already in
# the workspace through vessel-harness.
dirs.workspace = true
futures-util = { workspace = true, features = ["sink"] }
# Schedules' times in a person's time zone (ADR 0033, `automation::time`):
# the bundled IANA database and civil dates, so a daylight-saving gap or
# fold is decided by our rule, the same on every platform.
jiff = { workspace = true, features = ["tz-system"] }
# Device credentials and invitation secrets (ADR 0010); already in the
# workspace through vessel-store.
getrandom.workspace = true
hostname.workspace = true
# An empty root store for `ws://`-only relays on a machine with no system
# roots (`vessel_relay::TlsConfig::with_roots`); already built for
# vessel-relay.
rustls.workspace = true
# Fetching the ACP registry (`agent.catalogue`, protocol 11): the same
# client and roots as the model proxy's (vessel-llm); already built.
reqwest.workspace = true
rustls-native-certs.workspace = true
# The fleet's own files (`fleet/*.json`).
serde.workspace = true
serde_json.workspace = true
# Invitations are kept by the hash of their secret (ADR 0010).
sha2.workspace = true
# Model tokens compared in constant time (ADR 0015); already in the
# workspace through vessel-store.
subtle.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["io-std"] }
# `fleet.toml`: typed reading, and `vessel fleet init` writing it with
# correct quoting; already in the workspace (the node book).
toml_edit.workspace = true
tokio-util = { workspace = true, features = ["rt"] }
tracing.workspace = true
tracing-subscriber.workspace = true
# A file attachment's `file:` URI for the agent (protocol 10, ADR 0025),
# percent-encoded and right for Windows drive letters; already in the
# workspace (vessel-lsp).
url.workspace = true
uuid.workspace = true
web-push-native.workspace = true

[dev-dependencies]
vessel-local-node.workspace = true
# Construct the concrete PTY Thread cause for the existing session/wire error edge.
vessel-pty.workspace = true
# portable-pty uses log; exercise that actual bridge, not only tracing events.
log.workspace = true
# `test-util`: the probes' cache is checked on a paused clock. Without it
# here, `cargo test -p vessel-node` alone did not build: the feature came
# only from other crates of a whole-workspace build.
tokio = { workspace = true, features = ["test-util"] }
# Moving a device's pairing time back in a home's database (e2e
# `callback`), so a window is tested without waiting it out.
rusqlite.workspace = true
tempfile.workspace = true
vessel-harness = { workspace = true, features = ["fakes"] }
# The workspace tests run the machine's real git (protocol 10).
which.workspace = true
# An agent's `vessel` tools driven across a fleet (e2e `across`). Not a
# cycle: vessel-mcp itself needs only vessel-client and vessel-proto.
vessel-mcp.workspace = true
# A relay client that says, through a trusted proxy's header, which
# address it comes from (e2e `crowd`); already built for vessel-relay.
tokio-tungstenite.workspace = true
# The misbehaving relay (feature `relay`) for the secure e2e tests, and
# the fake model provider (feature `upstream`) for the model proxy's.
vessel-testkit = { workspace = true, features = ["relay", "upstream", "authority-fixtures"] }
# The in-memory forge (feature `fake`) for the pull request e2e tests.
vessel-forge = { workspace = true, features = ["fake"] }

[lints]
workspace = true
