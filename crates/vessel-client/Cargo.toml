[package]
name = "vessel-client"
description = "Typed async client for Vessel nodes, with gap-free session streams"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license-file.workspace = true
repository.workspace = true

[dependencies]
vessel-proto.workspace = true
vessel-relay.workspace = true
vessel-rpc.workspace = true
vessel-secure.workspace = true

# An attachment's pieces (protocol 10's `attachment.write`), as the wire
# type carries them; already in the workspace through vessel-proto.
bytes.workspace = true
futures-util = { workspace = true, features = ["sink"] }
# The random suffix of a credential file's temporary name; already in the
# workspace through vessel-store and vessel-secure.
getrandom.workspace = true
# An empty root store when every route is `ws://` and the system has no
# roots (`vessel_relay::TlsConfig::with_roots`); already built for
# vessel-relay.
rustls.workspace = true
serde.workspace = true
# The device preamble's frames (ADR 0010), before `vessel-rpc` takes over.
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
tokio-tungstenite.workspace = true
toml_edit.workspace = true
tracing.workspace = true

# ADR 0097: client-owned book/credential filesystem boundary, not store/fleet.
[target.'cfg(unix)'.dependencies]
rustix = { workspace = true, features = ["fs"] }

[dev-dependencies]
vessel-testkit = { path = "../vessel-testkit" }
bytes.workspace = true
chrono.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["test-util"] }
tokio-util.workspace = true

[lints]
workspace = true
