[package]
name = "vessel-testkit"
description = "Fake harness binaries (fake-tui, fake-acp, fake-ssh, fake-tool) for Vessel's process-level tests; never shipped"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license-file.workspace = true
repository.workspace = true
publish = false

[[bin]]
name = "fake-tui"
path = "src/bin/fake_tui.rs"

[[bin]]
name = "fake-local-node"
path = "src/bin/fake_local_node.rs"

[[bin]]
name = "fake-acp"
path = "src/bin/fake_acp.rs"

[[bin]]
name = "fake-ssh"
path = "src/bin/fake_ssh.rs"

[[bin]]
name = "fake-tool"
path = "src/bin/fake_tool.rs"

[[bin]]
name = "fake-provider"
path = "src/bin/fake_provider.rs"

[[bin]]
name = "fake-lsp"
path = "src/bin/fake_lsp.rs"

[[bin]]
name = "fake-codex-app-server"
path = "src/bin/fake_codex_app_server.rs"

[[bin]]
name = "fake-claude-stream"
path = "src/bin/fake_claude_stream.rs"

[features]
# Typed caller-authority fixtures; ordinary fake binaries keep no wire dependency.
authority-fixtures = ["dep:vessel-proto"]
# The misbehaving relay (`relay` module): a websocket proxy, so only tests
# that need it pay for the websocket stack (the fake binaries do not).
relay = ["dep:futures-util", "dep:tokio-tungstenite"]
# The fake model provider (`upstream` module, milestone 5): an HTTP server,
# so only the tests that call a provider pay for it.
upstream = ["dep:axum", "dep:futures-util", "tokio/net", "tokio/time"]

[dependencies]
vessel-proto = { workspace = true, optional = true }
agent-client-protocol.workspace = true
axum = { workspace = true, optional = true }
# fake-acp's `describe`: an image's or audio block's bytes decoded, and a
# resource link's `file:` URI read, to say what reached the agent
# (protocol 10's attachments). Both already in the workspace.
base64.workspace = true
url.workspace = true
futures-util = { workspace = true, optional = true, features = ["sink"] }
serde_json.workspace = true
serde.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["io-std", "rt"] }
tokio-tungstenite = { workspace = true, optional = true }
tokio-util = { workspace = true, features = ["compat"] }

[target.'cfg(unix)'.dependencies]
rustix.workspace = true

[lints]
workspace = true
