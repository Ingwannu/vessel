[package]
name = "vessel-store"
description = "Vessel node data directory: identity, access token, and the SQLite session event log"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license-file.workspace = true
repository.workspace = true

[dependencies]
vessel-proc.workspace = true
vessel-proto.workspace = true

base64.workspace = true
chrono.workspace = true
dirs.workspace = true
getrandom.workspace = true
rusqlite.workspace = true
num-bigint.workspace = true
num-traits.workspace = true
rust_decimal.workspace = true
serde.workspace = true
serde_json.workspace = true
# SHA-256 of device credentials (ADR 0010), and of attachments (ADR
# 0025); already used by vessel-remote.
sha2.workspace = true
subtle.workspace = true
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true
# Wipes the store's copy of `node.key` from memory (ADR 0009).
zeroize.workspace = true

[target.'cfg(unix)'.dependencies]
# Attachments (protocol 10, ADR 0025): folders opened relative to the one
# before with `O_NOFOLLOW | O_DIRECTORY`, files with `O_NOFOLLOW`, an upload
# moved in with `renameat`, so nothing below `attachments/` is reached
# through a link. Safe wrappers, already in the tree with this feature
# (vessel-fleet's `dir`), so no new crate is built.
rustix = { workspace = true, features = ["fs"] }

[dev-dependencies]
bytes.workspace = true
criterion.workspace = true
futures-util.workspace = true
tempfile.workspace = true

# `docs/PERFORMANCE.md`: appending to and reading a session's log.
[[bench]]
name = "log"
harness = false

[lints]
workspace = true
