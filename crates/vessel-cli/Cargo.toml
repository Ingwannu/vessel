[package]
name = "vessel-cli"
description = "Vessel command-line client: run, attach to and inspect harness sessions on a node"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license-file.workspace = true
repository.workspace = true

[[bin]]
name = "vessel"
path = "src/main.rs"

[dependencies]
vessel-client.workspace = true
# `vessel init`: harness discovery, install and login commands, other
# accounts' homes (plan F5).
vessel-harness.workspace = true
vessel-mcp.workspace = true
vessel-node.workspace = true
vessel-proto.workspace = true
vessel-remote.workspace = true
# `vessel ui` (ADR 0017).
vessel-web.workspace = true

bytes.workspace = true
# The pairing link's expiry (`vessel nodes add --pair`); already in the
# workspace.
chrono.workspace = true
clap.workspace = true
crossterm.workspace = true
dirs.workspace = true
# `vessel schedule create --cron` without `--tz`: the zone this machine is
# in, by its IANA name (`tz-system`); already in the workspace for the node.
jiff = { workspace = true, features = ["tz-system"] }
# The name a paired device gives itself (`vessel nodes add --pair`); as
# vesseld names its node.
hostname.workspace = true
qrcode.workspace = true
# Retain the typed error from encoding a confirmed invitation for fleet.join.
# Previously test-only; this reuses the same workspace-pinned dependency.
# Typed passive comparison resource reports; already used by the client.
serde.workspace = true
serde_json.workspace = true
# A scratch directory for a release download (`vessel node install`).
tempfile.workspace = true
thiserror.workspace = true
# `fs`: `vessel send --attach` reads a file a piece at a time.
tokio = { workspace = true, features = ["io-std", "fs"] }
# Stopping `vessel ui`'s server; already in the workspace.
tokio-util.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
# Advance only the file client wait clocks; no product timer changes.
tokio = { workspace = true, features = ["test-util"] }
# The load test (`tests/load`, `docs/PERFORMANCE.md`) is a browser tab of
# `vessel ui`: its websocket and the mutual proof's HMAC. All four are
# already in the workspace (vessel-web's own dependencies).
futures-util.workspace = true
hmac.workspace = true
sha2.workspace = true
tokio-tungstenite.workspace = true
tempfile.workspace = true
# An in-process relay for `vessel nodes add --pair` end to end.
vessel-relay.workspace = true
vessel-harness = { workspace = true, features = ["fakes"] }
# The SSH tests stop any node they started (its lock names its pid).
vessel-store.workspace = true
# The fake model provider (feature `upstream`) for the model canary.
vessel-testkit = { workspace = true, features = ["upstream"] }
# The script tests run the machine's real git (protocol 11); already in
# the workspace (vessel-node's tests).
which.workspace = true

[lints]
workspace = true
