[package]
name = "vessel-proto"
description = "Wire contract for Vessel nodes and clients: ids, sessions, events, typed RPC"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license-file.workspace = true
repository.workspace = true

[features]
# TypeScript declarations of the wire types, for the web UI (ADR 0017):
# `ts_rs::TS` derives and the generator in `ts`. Nothing on the wire
# changes; only the declaration check and `vessel-web`'s tests enable it.
ts = ["dep:ts-rs"]

[dependencies]
base64.workspace = true
bytes.workspace = true
chrono.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
ts-rs = { workspace = true, optional = true }
# Parse dictation endpoint addresses once, with userinfo and cleartext refusal
# before settings or provider work (ADR 0067), and push service endpoints
# (ADR 0041).
url.workspace = true
# One bounded resource-language decoder shared with native view (ADR 0079).
# MIT OR Apache-2.0, existing native pin/features, offline cache verified.
unic-langid.workspace = true
uuid.workspace = true

[dev-dependencies]
criterion.workspace = true
# Exact local client-book integer round trips; never used by product proto.
toml_edit.workspace = true

# `docs/PERFORMANCE.md`: a subscription event's text, encoded and decoded.
[[bench]]
name = "frames"
harness = false

[lints]
workspace = true
